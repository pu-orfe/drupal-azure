; ---------------------------------------------------------------------------
; Supervisor runs nginx and php-fpm in one container.
;
; Container Apps expects one container per app and sends SIGTERM when draining a
; replica (scale-in, revision swap). What matters here is that the shutdown is
; ORDERED and GRACEFUL, because the entrypoint may have just finished a schema
; update and there may be in-flight requests:
;
;   nginx gets SIGQUIT (graceful: finish in-flight requests, then exit) rather
;   than the default SIGTERM (fast shutdown: drop them).
;   nginx stops FIRST, so no new request reaches a php-fpm that is already
;   winding down and would answer 502.
;
; Priority controls both start and stop order: lower priority starts earlier and
; stops LATER, so php-fpm (10) outlives nginx (20).
; ---------------------------------------------------------------------------
[supervisord]
nodaemon=true
; PID 1 in the container. Logging to a file inside a replica that is about to be
; destroyed is pointless; stdout goes to Log Analytics.
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
priority=10
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; If either process dies for good, the container must die too.
;
; Without this, supervisor keeps running as PID 1 after php-fpm has exhausted
; its restarts. The container stays "up", the liveness probe on /nginx-health
; still passes because nginx is fine, and every request returns 502 — a replica
; that is broken but reports healthy, which is the worst state to be in. Exiting
; lets Container Apps replace the replica and, on a new revision, refuse to
; shift traffic to it.
; ---------------------------------------------------------------------------
[eventlistener:process-exit]
command=sh -c 'printf "READY\n"; while read -r line; do echo "supervisor: $line" >&2; kill -TERM 1; done'
events=PROCESS_STATE_FATAL
