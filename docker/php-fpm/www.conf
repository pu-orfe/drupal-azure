[www]
; ---------------------------------------------------------------------------
; clear_env = no is LOAD-BEARING, not tuning.
;
; PHP-FPM's default is clear_env = yes: the master process wipes the environment
; before handing a request to a worker. Every environment variable injected by
; the Container App — DRUPAL_DB_HOST, DRUPAL_DB_PASSWORD, DRUPAL_HASH_SALT,
; DRUPAL_TRUSTED_HOSTS — is therefore invisible to getenv() inside PHP, while
; remaining perfectly visible to the entrypoint, to drush, and to `php -r` on
; the command line.
;
; That asymmetry is the whole trap. `drush status` reports a healthy database
; connection, the entrypoint runs updb successfully, and every web request
; fails to connect — because settings.php reads its credentials with getenv()
; and gets nothing. A settings file built around environment variables cannot
; work on php-fpm without this line.
; ---------------------------------------------------------------------------
clear_env = no

; Log to the container's stderr so Container Apps ships it to Log Analytics.
; The default is a file inside the container, which is lost with the replica.
catch_workers_output = yes
decorate_workers_output = no

; Container Apps sizes replicas by CPU/memory and scales horizontally, so a
; fixed small pool matched to the replica is right — `dynamic` spends its
; complexity budget on a problem (bursty load on a fixed host) that horizontal
; autoscaling already solves, and an oversized pool on a 0.5-CPU replica just
; means every request is slow instead of some requests queueing.
;
; Roughly (memory_limit x max_children) must fit the replica's memory: at 512M
; memory_limit and 1Gi, 8 children is optimistic in the worst case and fine in
; practice because Drupal requests rarely approach the limit. Raise appMemory
; before raising this.
pm = static
pm.max_children = 8

; Recycle workers to bound the effect of a leak in any one module.
pm.max_requests = 500

; Must exceed nginx's fastcgi_read_timeout, or nginx reports 504 while the
; worker is still running and the request is billed twice.
request_terminate_timeout = 330

; Surface slow requests with a stack trace. This is the only cheap way to find
; out *where* a Drupal page is spending ten seconds on a live container.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
