[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
; Drupal 10 core alone is well past 10k files once contrib is installed, and
; exceeding max_accelerated_files silently stops caching the overflow rather
; than erroring, which reads as "opcache is not helping" instead of "opcache is
; full". The status report warns when the cache is over 90% full.
opcache.max_accelerated_files=20000

; The code in this image is immutable — a new revision is a new image, never an
; edit in place — so there is nothing for a timestamp check to detect. Turning
; validation off removes a stat() per included file per request.
;
; The corollary: any change to PHP under /var/www/html at runtime is invisible
; until the container restarts. That is the intended property, but it is why
; hot-patching a live container does nothing.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Drupal reads docblock annotations at runtime (plugin discovery in core, and
; widely in contrib that has not migrated to PHP attributes). Stripping comments
; breaks plugin discovery with errors that point nowhere near the cause, so this
; must stay 1 — it is the single most common way a "production PHP tuning"
; snippet breaks Drupal.
opcache.save_comments=1
