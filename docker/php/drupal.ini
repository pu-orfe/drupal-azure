; Sized for Drupal with a real module set. 256M is enough to serve pages but not
; to run `drush updb` on a site with a few hundred thousand entities, and the
; entrypoint runs updb in this same container.
memory_limit=512M

upload_max_filesize=128M
post_max_size=128M
max_execution_time=300
max_input_vars=4000

; Errors belong in the log, not the response body. Stack traces in HTML leak
; filesystem paths and, on a Drupal error page, occasionally credentials from a
; database exception's context.
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/proc/self/fd/2

expose_php=Off
date.timezone=UTC

; Drupal manages session lifetime itself; these are the floor.
session.cookie_httponly=1
session.use_strict_mode=1
