# ---------------------------------------------------------------------------
# Nginx vhost for Drupal behind the Container Apps ingress.
# ---------------------------------------------------------------------------

# The ingress terminates TLS and forwards over HTTP, so every request arrives
# from an in-cluster address. Recover the real client IP from X-Forwarded-For so
# access logs, rate limiting and Drupal's flood control see the actual client
# rather than the ingress. Without this, one abusive client trips flood control
# for everyone, because Drupal sees a single IP for all traffic.
#
# The ranges are the Container Apps environment's own subnet space. They are
# private ranges, and X-Forwarded-For is only trusted from them, so a client
# cannot spoof its address by sending the header itself.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Normalise X-Forwarded-Proto into the exact value PHP expects.
#
# Passing the header through verbatim as the HTTPS FastCGI param is subtly wrong:
# PHP treats HTTPS as ON for any non-empty value other than the literal "off", so
# forwarding a plain-HTTP request would set HTTPS to "http" — which is non-empty,
# and therefore reads as secure. It happens not to bite behind an ingress that
# only ever speaks HTTPS, and it would bite immediately behind anything else.
map $http_x_forwarded_proto $fastcgi_https {
    default '';
    https   on;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/web;
    index index.php;

    # Match the PHP settings in docker/php/drupal.ini. A mismatch fails uploads
    # at whichever limit is lower, and nginx's failure mode (413 with no Drupal
    # page) is the more confusing of the two.
    client_max_body_size 128M;

    # ---------------------------------------------------------------------
    # Liveness endpoint. Answered by nginx itself, with no PHP and no database,
    # so it reports exactly one thing: the web server is up.
    #
    # This is deliberately NOT the readiness target. A liveness probe that hits
    # Drupal restarts the replica whenever the database is briefly unreachable —
    # which converts a recoverable database blip into a crash loop across every
    # replica at once. Readiness (see infra/modules/aca.bicep) hits Drupal,
    # because "should this replica receive traffic" genuinely does depend on
    # whether Drupal can serve.
    # ---------------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Security headers. Not a substitute for Drupal's own, but they apply to
    # static responses that never reach PHP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { allow all; log_not_found off; access_log off; }

    # Let ACME/.well-known through before the dotfile rule below blocks it.
    location ^~ /.well-known/ { allow all; }

    location ~ (^|/)\. { return 403; }

    # Drupal's own .htaccess equivalent: never serve source or backup files.
    location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|^(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config)$|^#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
        deny all;
        return 404;
    }

    # ---------------------------------------------------------------------
    # Managed files.
    #
    # `location ~ ^/sites/.*/files/styles/` must come BEFORE the generic static
    # rule, or a missing image derivative is served as a 404 by nginx instead of
    # being generated by Drupal's image style pipeline — every derivative then
    # 404s until someone flushes and regenerates by hand.
    # ---------------------------------------------------------------------
    location ~ ^/sites/[^/]+/files/styles/ {
        try_files $uri @drupal;
    }

    # Private files are served by Drupal (system.private_file_download), never
    # by nginx. This blocks a direct hit on the path in case the private
    # directory is ever placed inside the docroot by mistake.
    location ~ ^/sites/[^/]+/files/private/ { return 403; }
    location ~ ^/private/                   { return 403; }

    # Never execute or serve PHP out of vendor/ or the file directories. An
    # uploaded .php in a files directory is the classic Drupal RCE path.
    location ~ ^/vendor/ { deny all; return 404; }
    location ~ ^/sites/[^/]+/files/.*\.php$ { deny all; return 404; }

    # ---------------------------------------------------------------------
    # Static assets.
    #
    # `immutable` only applies to Drupal's aggregated/derivative assets, which
    # carry a cache-busting query or hash. It is wrong for a plain theme file
    # edited in place — but in this architecture theme files ship in an
    # immutable image, so the claim holds.
    # ---------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf)$ {
        try_files $uri @drupal;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri @drupal;
    }

    location @drupal {
        # Single front controller. `/index.php?$query_string` rather than the
        # legacy `?q=$1` rewrite: Drupal has read the path from REQUEST_URI
        # since 8.x, and the ?q= form corrupts requests whose path contains a
        # literal `&` or `=`.
        rewrite ^ /index.php last;
    }

    location ~ '\.php$|^/update.php' {
        # Only the front controller and update.php are executable. Anything else
        # ending in .php under the docroot — a stray script, an uploaded file
        # that slipped past the rules above — is refused rather than run.
        location ~ ^/(index|update|core/(authorize|install|rebuild|modules/statistics/statistics))\.php {
            fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
            include fastcgi_params;

            # Neutralise the httpoxy class of bug: a client-supplied Proxy
            # header would otherwise become HTTP_PROXY in the worker and
            # redirect Drupal's own outbound HTTP through an attacker's host.
            fastcgi_param HTTP_PROXY "";

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param QUERY_STRING $query_string;

            # HTTPS on, always. The ingress terminates TLS, so without this PHP
            # sees a plain HTTP request and Drupal generates http:// absolute
            # URLs — which breaks OAuth redirect URIs, password reset links and
            # any form posting to an absolute action.
            fastcgi_param HTTPS $fastcgi_https;

            fastcgi_intercept_errors off;
            fastcgi_pass 127.0.0.1:9000;

            # Must stay below php-fpm's request_terminate_timeout (330s) so the
            # worker, not nginx, decides when a long request dies.
            fastcgi_read_timeout 300;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
        return 404;
    }

    # Drupal's own error pages, not nginx's.
    location = /50x.html { internal; }
}
