###############################################################################
# Drupal Update & Deploy Pipeline
#
# Trigger manually or on a schedule to:
#   1. Run `composer update` and commit the lock file
#   2. Build a new Docker image with updated code
#   3. Push the image to Azure Container Registry
#   4. Deploy a new revision to Azure Container Apps
#   5. Run post-deploy Drush commands (updb, cr)
###############################################################################

name: Drupal Update & Deploy

on:
  workflow_dispatch:
    inputs:
      composer_update:
        description: "Run composer update before building?"
        type: boolean
        default: true
  schedule:
    # Weekly on Sunday at 03:00 UTC
    - cron: "0 3 * * 0"

env:
  # ── Azure resource names (must match your Bicep deployment) ──
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
  IMAGE_NAME: app-drupal

permissions:
  contents: write  # needed to push composer.lock

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Composer Update (optional)
  # ─────────────────────────────────────────────────────────────────────────
  composer-update:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.composer_update == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Composer Update
        run: composer update --no-dev --no-interaction --prefer-dist

      - name: Commit composer.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet composer.lock; then
            echo "No changes to composer.lock"
          else
            git add composer.lock
            git commit -m "chore: update composer.lock [skip ci]"
            git push
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build & Push Docker Image
  # ─────────────────────────────────────────────────────────────────────────
  build-push:
    needs: [composer-update]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch latest in case composer-update pushed a new lock file
          ref: ${{ github.ref }}

      - name: Pull latest changes
        run: git pull --ff-only || true

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Image metadata
        id: meta
        run: |
          TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"
          LATEST="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        run: |
          docker build \
            -t "${{ steps.meta.outputs.tag }}" \
            -t "${{ steps.meta.outputs.latest }}" \
            .
          docker push "${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.latest }}"

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Deploy to Azure Container Apps
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ needs.build-push.outputs.image_tag }}"

      - name: Wait for revision to be ready
        run: |
          echo "Waiting for new revision to become active..."
          for i in $(seq 1 30); do
            STATUS=$(az containerapp revision list \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "[0].properties.runningState" -o tsv)
            if [ "$STATUS" = "Running" ]; then
              echo "Revision is running."
              exit 0
            fi
            echo "  Status: $STATUS (attempt $i/30)"
            sleep 10
          done
          echo "ERROR: Revision did not reach Running state after 5 minutes"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Post-Deploy: Drush database updates & cache rebuild
  # ─────────────────────────────────────────────────────────────────────────
  post-deploy:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Drush updb
        run: |
          az containerapp exec \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --command "sh" -- -c "drush updb -y" || echo "drush updb failed or no pending updates"

      - name: Run Drush cache rebuild
        run: |
          az containerapp exec \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --command "sh" -- -c "drush cr" || echo "drush cr failed"

      - name: Verify site health
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Checking https://$FQDN ..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "Site is healthy (HTTP $HTTP_CODE)"
          else
            echo "Site returned HTTP $HTTP_CODE — check logs!"
            exit 1
          fi
